# LegacyMaterials V20.3.0 per-material overrides.
# Section key is the Source VMT path without materials/ and .vmt.
# Source modes: auto, none, albedo, constant, $bumpmap, $normalmap,
# $envmapmask, $phongexponenttexture, bump_alpha, ssbump.

[materials."de_nuke/nukmetwallhab_wet"]
roughness = 0.18
metalness = 0.70
normal_source = "$bumpmap"
roughness_source = "$envmapmask"
height_source = "none"
invert_normal_y = false
force_ssbump = false
disable_height = true
disable_emission = false
